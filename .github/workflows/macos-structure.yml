name: macOS structural verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-native-structure:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:macos
